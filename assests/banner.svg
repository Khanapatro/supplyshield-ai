<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#12304a"/>
      <stop offset="100%" stop-color="#0b3b4a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <style>
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: center; }
      .float1 { animation: float 6s ease-in-out infinite; }
      .float2 { animation: float 7s ease-in-out infinite reverse; }
      .float3 { animation: float 5s ease-in-out infinite; }
      .flow { stroke-dasharray: 8 8; animation: dash 1.6s linear infinite; }
      .fade { animation: fade 1.6s ease-out both; }
      .sub { animation: fade 2.4s ease-out both; }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes dash { to { stroke-dashoffset: -32; } }
      @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- animated graph edges -->
  <g stroke="#00e5ff" stroke-opacity=".45" stroke-width="2" fill="none" class="flow">
    <line x1="90" y1="70" x2="200" y2="170"/>
    <line x1="200" y1="170" x2="330" y2="90"/>
    <line x1="330" y1="90" x2="430" y2="200"/>
    <line x1="870" y1="80" x2="980" y2="190"/>
    <line x1="980" y1="190" x2="1090" y2="90"/>
    <line x1="1090" y1="90" x2="1140" y2="210"/>
  </g>

  <!-- graph nodes -->
  <g class="float1"><circle cx="90" cy="70" r="9" fill="#00e5ff" class="pulse"/></g>
  <g class="float2"><circle cx="200" cy="170" r="12" fill="#e4003b" class="pulse"/></g>
  <g class="float3"><circle cx="330" cy="90" r="9" fill="#7c3aed" class="pulse"/></g>
  <g class="float1"><circle cx="430" cy="200" r="7" fill="#00e5ff" class="pulse"/></g>
  <g class="float2"><circle cx="870" cy="80" r="8" fill="#7c3aed" class="pulse"/></g>
  <g class="float3"><circle cx="980" cy="190" r="12" fill="#00e5ff" class="pulse"/></g>
  <g class="float1"><circle cx="1090" cy="90" r="9" fill="#e4003b" class="pulse"/></g>
  <g class="float2"><circle cx="1140" cy="210" r="7" fill="#7c3aed" class="pulse"/></g>

  <!-- title -->
  <text x="600" y="130" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#title)" class="fade">SupplyShield AI</text>
  <text x="600" y="180" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#cfefff" class="sub">Graph-Powered Supply Chain Disruption &amp; Recovery Agent</text>
  <text x="600" y="222" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#00e5ff" class="sub">FalkorDB  •  Multi-hop reasoning  •  MCP tools  •  Graph memory</text>
</svg>
