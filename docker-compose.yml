services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: supplyshield-db
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    restart: unless-stopped

  falkordb-browser:
    image: falkordb/falkordb-browser:latest
    container_name: supplyshield-browser
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - falkordb
    restart: unless-stopped

volumes:
  falkordb_data:
